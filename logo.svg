<svg xmlns="http://www.w3.org/2001/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Badge -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />
  
  <!-- Sound Waves (Left) -->
  <g fill="url(#waveGrad)">
    <rect x="80" y="216" width="14" height="80" rx="7" opacity="0.6"/>
    <rect x="110" y="186" width="14" height="140" rx="7" opacity="0.8"/>
    <rect x="140" y="156" width="14" height="200" rx="7" />
    <rect x="170" y="196" width="14" height="120" rx="7" />

    <!-- Sound Waves (Right) -->
    <rect x="328" y="196" width="14" height="120" rx="7" />
    <rect x="358" y="156" width="14" height="200" rx="7" />
    <rect x="388" y="186" width="14" height="140" rx="7" opacity="0.8"/>
    <rect x="418" y="216" width="14" height="80" rx="7" opacity="0.6"/>
  </g>

  <!-- Microphone Symbol -->
  <rect x="226" y="150" width="60" height="110" rx="30" fill="#ffffff" filter="url(#glow)"/>
  <path d="M 206 230 A 50 50 0 0 0 306 230" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="280" x2="256" y2="330" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <line x1="220" y1="330" x2="292" y2="330" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

  <!-- Logo Typography -->
  <text x="256" y="415" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="34" letter-spacing="3">VIET VOICE</text>
  <text x="256" y="445" text-anchor="middle" fill="#93c5fd" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="16" letter-spacing="4">STUDIO</text>
</svg>
